name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            *.md
            agents/*.md
            commands/*.md
            refs/**/*.md
            !CHANGELOG.md

  link-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude-path node_modules
            --exclude '^https?://(localhost|127\.0\.0\.1|.*\.example).*'
            CLAUDE.md CLAUDE.agent.md LEARNINGS.md WORKFLOW.md README.md
            agents/*.md commands/*.md refs/**/*.md
          fail: true

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC2155 -e SC2086
        with:
          scandir: ./scripts
          severity: warning

  agent-frontmatter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: verify every agent has required frontmatter
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in agents/*.md; do
            head=$(head -10 "$f")
            for key in name description tools model; do
              if ! grep -qE "^${key}:" <<<"$head"; then
                echo "::error file=$f::missing frontmatter key '${key}'"
                fail=1
              fi
            done
          done
          [[ $fail -eq 0 ]] || exit 1
          echo "All agents have required frontmatter."
